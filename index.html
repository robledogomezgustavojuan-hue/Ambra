    <style>

            --stat-bg: #fff;
            --stat-border: 1px solid rgba(180,150,70,0.5);
            --today-bg: #fff;
            --today-border: 1px solid rgba(180,150,70,0.5);
            --paid-bg: #fff;
            --paid-border: 1px solid rgba(0,180,100,0.5);
            --savings-bg: #fff;
            --savings-border: 1px solid rgba(0,150,220,0.5);
            --table-bg: rgba(0,0,0,0.02);
            --table-header-bg: rgba(0,0,0,0.03);
            --table-border: rgba(0,0,0,0.06);
            --subtab-bg: rgba(0,0,0,0.05);
            --subtab-border: rgba(0,0,0,0.12);
            --subtab-color: rgba(0,0,0,0.55);

            --slider-bg: linear-gradient(145deg, #FF8A2B, #E76300);
            --radio-bg: rgba(0,0,0,0.04);
            --radio-border: rgba(0,0,0,0.12);
            --checkbox-bg: rgba(0,0,0,0.04);

            --modal-border: 1px solid rgba(180,150,70,0.5);

        body {
            background: var(--bg-body);
            background: var(--bg-gradient);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            padding: 40px 20px 120px 20px;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        @keyframes platinumPulse {
            0% { text-shadow: 0 0 5px #e0c080, 0 0 10px #c0a060; }
            100% { text-shadow: 0 0 20px #ffe0b0, 0 0 35px #d0b070, 0 0 50px #b09050; }
        }
        @keyframes borderPulse {
            0% { border-color: rgba(255,180,50,0.6); box-shadow: 0 0 5px rgba(255,180,50,0.2); }
            50% { border-color: rgba(255,220,100,0.9); box-shadow: 0 0 15px rgba(255,200,80,0.4); }
            100% { border-color: rgba(255,150,30,0.6); box-shadow: 0 0 5px rgba(255,150,30,0.2); }
        }
        @keyframes greenPulse {
            0% { color: #00cc66; text-shadow: 0 0 5px #00cc66; }
            100% { color: #00ff88; text-shadow: 0 0 15px #00ff88; }
        }
        @keyframes redBlink {
            0%, 100% { color: #ff4444; }
            50% { color: #ff0000; text-shadow: 0 0 8px #ff0000; }
        }
        .header-logo {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e0d0a0, #f0e8c0, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
            animation: platinumPulse 2s ease-in-out infinite alternate;
        }
        .card-premium, .login-card, .stat-block, .today-debt-card, .today-paid-card, .today-savings-card, .modal-inner {
            animation: borderPulse 3s ease-in-out infinite;
        }
        .card-premium, .login-card {
            background: var(--card-bg);
            border: var(--card-border);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(4px);
            transition: none;
        }
        .card-premium { padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-premium h3 { color: var(--text-color); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; font-size: 1.3rem; }
        .card-premium h3 i { color: #FF7A1A; }
        .stat-block {
            background: var(--stat-bg);
            border-radius: 28px;
            padding: 1.5rem 1rem;
            text-align: center;
            border: var(--stat-border);
            box-shadow: var(--stat-shadow);
            transition: none;
        }
        .stat-block.red-glow {
            border-color: var(--red-glow-border);
            background: var(--red-glow-bg);
        }
        .stat-block .text-muted { color: var(--text-muted); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-block .value-large { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #FFB066, #FF7A1A); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-block.red-glow .value-large { background: linear-gradient(135deg, #FF6666, #FF2222); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .today-debt-card, .today-paid-card, .today-savings-card {
            border-radius: 28px;
            padding: 1.5rem 1.8rem;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            box-shadow: var(--card-shadow);
            transition: none;
        }
        .today-debt-card { background: var(--today-bg); border: var(--today-border); }
        .today-paid-card { background: var(--paid-bg); border: var(--paid-border); }
        .today-savings-card { background: var(--savings-bg); border: var(--savings-border); }
        .today-debt-info, .today-paid-info, .today-savings-info { flex: 1; min-width: 200px; }
        .today-debt-label, .today-paid-label, .today-savings-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .today-debt-value { font-size: 2.4rem; font-weight: 800; background: linear-gradient(135deg, #FFB066, #FF7A1A); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2; margin-bottom: 12px; }
        .today-paid-value { font-size: 2.4rem; font-weight: 800; background: linear-gradient(135deg, #00cc66, #00ff88); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2; margin-bottom: 12px; }
        .today-savings-value { font-size: 2.4rem; font-weight: 800; background: linear-gradient(135deg, #00aaff, #0066cc); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2; margin-bottom: 12px; }
        .today-debt-details, .today-paid-details, .today-savings-details { max-height: 170px; overflow-y: auto; padding-right: 8px; margin-top: 8px; }
        .debt-detail-item, .paid-detail-item, .savings-detail-item { font-size: 0.75rem; color: var(--debt-detail-color); padding: 7px 0; border-bottom: 1px solid var(--debt-detail-item-bg); display: flex; align-items: center; gap: 8px; }
        .debt-detail-item:last-child, .paid-detail-item:last-child, .savings-detail-item:last-child { border-bottom: none; }
        .debt-detail-item i { color: #FF7A1A; font-size: 0.7rem; width: 16px; }
        .today-debt-details .debt-detail-item { color: #ffffff; text-shadow: 0 0 6px rgba(255,255,255,0.7); }
        .paid-detail-item i { color: #00cc66; font-size: 0.7rem; width: 16px; animation: greenPulse 1.5s ease-in-out infinite alternate; }
        .paid-detail-item span { animation: greenPulse 1.5s ease-in-out infinite alternate; }
        .savings-detail-item i { color: #00aaff; font-size: 0.7rem; width: 16px; }
        .debt-detail-item.reminder-item { color: var(--reminder-item-color); }
        .debt-detail-item.urgent { animation: redBlink 1s infinite; }
        .reminder-check-btn {
            background: var(--reminder-btn-bg); border: 1px solid var(--reminder-btn-border); color: var(--reminder-btn-color);
            border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; margin-left: auto;
        }
        .reminder-check-btn:hover { background: #87CEEB; color: black; }
        .time-badge {
            border: 1px solid var(--btn-outline-border); border-radius: 6px; padding: 2px 8px;
            font-size: 0.7rem; color: var(--text-muted); background: var(--switch-container-bg); white-space: nowrap;
        }
        .debt-detail-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .progress-bar-container { background: var(--progress-bg); border-radius: 10px; height: 10px; margin: 5px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 10px; transition: width 0.3s ease; }
        .progress-bar-fill.green { background: linear-gradient(90deg, #00cc66, #00ff88); }
        .progress-bar-fill.yellow { background: linear-gradient(90deg, #ffaa00, #ffcc00); }
        .progress-bar-fill.red { background: linear-gradient(90deg, #ff4444, #ff0000); }
        .today-debt-btn { background: rgba(255,122,26,0.2); border: 1px solid #FF7A1A; border-radius: 40px; padding: 10px 24px; color: #FFB066; font-weight: 500; cursor: pointer; transition: 0.2s; white-space: nowrap; font-size: 0.9rem; }
        .today-debt-btn:hover { background: #FF7A1A; color: black; }
        .btn-amber {
            background: linear-gradient(180deg, #FF8A2B, #E76300); border: none; border-radius: 18px; padding: 12px 24px;
            font-weight: 600; font-size: 0.9rem; color: white; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-amber:active { transform: scale(0.97); }
        .btn-outline-light { background: transparent; border: 1px solid var(--btn-outline-border); border-radius: 18px; padding: 10px 20px; color: var(--btn-outline-color); font-weight: 500; cursor: pointer; }
        .btn-sm { padding: 8px 12px; font-size: 0.8rem; border-radius: 18px; }
        input, select { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 22px; padding: 14px 18px; color: var(--text-color); width: 100%; margin-bottom: 12px; }
        input:focus, select:focus { outline: none; border-color: #FF7A1A; box-shadow: 0 0 0 3px rgba(255,122,26,0.25); }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-label); margin-bottom: 6px; display: block; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: var(--switch-container-bg); border-radius: 60px; padding: 6px 16px; margin: 12px 0; border: 1px solid var(--switch-container-border); }
        .switch-label { font-weight: 500; color: var(--text-muted); font-size: 0.85rem; letter-spacing: 0.3px; }
        .switch { position: relative; display: inline-block; width: 56px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--switch-bg); border-radius: 34px; transition: 0.3s; border: 1px solid var(--switch-border); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 2px; background: var(--slider-bg); border-radius: 50%; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.3), 0 0 4px rgba(255,122,26,0.6); }
        input:checked + .slider { background-color: rgba(255,122,26,0.25); border-color: #FF7A1A; }
        input:checked + .slider:before { transform: translateX(26px); background: linear-gradient(145deg, #FFB066, #FF7A1A); box-shadow: 0 0 8px #FF7A1A; }
        .switch-small { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch-small input { opacity: 0; width: 0; height: 0; }
        .slider-small { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--switch-bg); border-radius: 34px; transition: 0.3s; border: 1px solid var(--switch-border); }
        .slider-small:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 2px; background: var(--slider-bg); border-radius: 50%; transition: 0.3s; }
        input:checked + .slider-small { background-color: rgba(255,122,26,0.25); border-color: #FF7A1A; }
        input:checked + .slider-small:before { transform: translateX(20px); background: linear-gradient(145deg, #FFB066, #FF7A1A); }
        .radio-group { display: flex; gap: 1rem; background: var(--radio-bg); border-radius: 60px; padding: 6px; margin: 12px 0; border: 1px solid var(--radio-border); }
        .radio-option { flex: 1; text-align: center; padding: 8px; border-radius: 40px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: 0.2s; color: var(--text-muted); }
        .radio-option.active { background: #FF7A1A; color: black; box-shadow: 0 2px 8px rgba(255,122,26,0.4); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; background: var(--checkbox-bg); padding: 12px; border-radius: 24px; }
        .checkbox-group label { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 400; color: var(--text-muted); }
        .table-wrapper { overflow-x: auto; border-radius: 24px; }
        .table-dark-premium { width: 100%; border-collapse: collapse; background: var(--table-bg); border-radius: 28px; }
        .table-dark-premium th { text-align: left; padding: 16px 12px; background: var(--table-header-bg); color: #FFB066; font-size: 0.75rem; }
        .table-dark-premium td { padding: 14px 12px; border-bottom: 1px solid var(--table-border); color: var(--text-color); }
        .bottom-nav { position: fixed; bottom: 24px; left: 20px; right: 20px; height: 70px; background: var(--nav-bg); backdrop-filter: blur(22px); border-radius: 30px; border: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: space-around; z-index: 1100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--nav-text-inactive); font-size: 0.7rem; background: transparent; border: none; cursor: pointer; }
        .nav-item i { font-size: 1.5rem; }
        .nav-item.active { color: #FF7A1A; text-shadow: 0 0 8px rgba(255,122,26,0.6); }
        .section-page { display: none; }
        .section-page.active-page { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .value-large { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #FFB066, #FF7A1A); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .badge-amb
